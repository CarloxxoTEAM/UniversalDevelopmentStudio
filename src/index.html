<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Development Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="uds-splash" role="status" aria-live="polite" aria-label="Carregando o Universal Development Studio">
 <div class="sp-card">
  <div class="sp-marca" aria-hidden="true">
   <svg viewBox="0 0 120 120" width="132" height="132">
    <defs><linearGradient id="sp-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff3d6e"/></linearGradient></defs>
    <rect class="sp-tile" x="4" y="4" width="112" height="112" rx="26" fill="url(#sp-g)"/>
    <g class="sp-cubo" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
     <polygon class="sp-f sp-f1" points="60,26 90,42 60,58 30,42" pathLength="100"/>
     <polygon class="sp-f sp-f2" points="30,42 60,58 60,94 30,78" pathLength="100"/>
     <polygon class="sp-f sp-f3" points="90,42 90,78 60,94 60,58" pathLength="100"/>
    </g>
   </svg>
  </div>
  <div class="sp-txt">
   <div class="sp-nome">Universal Development Studio</div>
   <div class="sp-lema">One Studio. Unlimited Possibilities.</div>
   <div class="sp-fim">
    <div id="sp-st" class="sp-st">Iniciando…</div>
    <div class="sp-trilho"><div id="sp-bar" class="sp-bar"></div></div>
    <div class="sp-rod"><span id="sp-ver"></span><span>Licença MIT · Clique ou Esc para pular</span></div>
   </div>
  </div>
 </div>
</div>
<div id="app">
 <header id="top">
  <img id="logo" src="logo.png" alt="Menu do UDS" title="Menu">
  <button id="modo" aria-label="Modo de trabalho"></button>
  <button id="proj"></button>
  <div id="crumb"></div>
  <div class="sp"></div>
  <div id="srch"><span id="si"></span><input id="sq" placeholder="Buscar em todo o projeto (versão 2.10)" disabled aria-label="Buscar em todo o projeto"></div>
  <div class="tg"><button id="t1" title="Barra lateral"></button><button id="t2" title="Painel inferior"></button><button id="t3" title="Notas"></button></div>
  <span id="zl" title="Ctrl+0 restaura o zoom">100%</span>
 </header>
 <div id="main">
  <nav id="act"></nav>
  <aside id="side"></aside>
  <div id="ctr">
   <div id="tabs"></div>
   <div id="txbar"></div>
   <div id="view"></div>
   <div id="panel">
    <div id="ptabs"></div>
    <div id="out"></div>
    <div id="cmd"><span id="pr"></span><input id="ci" spellcheck="false" aria-label="Terminal"></div>
   </div>
  </div>
  <aside id="notes"></aside>
  <div id="inicio" role="region" aria-label="Página inicial"></div>
 </div>
 <footer id="st"><span id="s1">UDS</span><span id="s2"></span><span id="s3"></span><span id="s4">UTF-8</span></footer>
</div>
<div id="drop"></div><div id="ctx"></div>
<div id="cfgwin" role="dialog" aria-label="Configurações"><div class="ct"><b>Configurações</b><span class="sp"></span><button id="cfgx" aria-label="Fechar">✕</button></div><div class="cb"><nav id="cfgnav"></nav><div id="cfgbody"></div></div></div>
<div id="prevwin" role="dialog" aria-label="Visualizar"><div class="ct"><button class="pv-volta" aria-label="Voltar" title="Voltar" style="display:none">◀</button><span class="pv-tit"></span><span class="pv-sub"></span><span class="sp"></span><button class="pv-abrir" title="Abrir em uma aba do UDS">Abrir no UDS</button><button class="pv-x" aria-label="Fechar" title="Fechar (Esc)">✕</button></div><div class="pv-corpo"></div></div>
<div id="mod"><div><label id="ml"></label><input id="mi" spellcheck="false"></div></div>
<script src="loading.js"></script>
<script src="icones/indice.js"></script>
<script src="core.js"></script>
<script src="deteccao.js"></script>
<script src="visualizadores/registro.js"></script>
<script src="recentes.js"></script>
<script src="modos/registro.js"></script>
<script src="modos/universal.js"></script>
<script src="modos/texto.js"></script>
<script src="modos/futuros.js"></script>
<script src="inicio.js"></script>
<script src="visualizar.js"></script>
<script src="audiometa.js"></script>
<script src="videometa.js"></script>
<script src="visualizadores/imagem.js"></script>
<script src="visualizadores/audio.js"></script>
<script src="visualizadores/video.js"></script>
<script src="app.js"></script>
</body>
</html>
