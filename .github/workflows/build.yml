name: Build UDS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows }
          - { os: ubuntu-22.04, platform: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependências do Linux
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm install
      - name: Testes da interface
        run: npm test
      - name: Gerar ícones do programa
        run: npx tauri icon app-icon.png
      - name: Testes do núcleo
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Compilar (sem instalador)
        run: npx tauri build --no-bundle
      - name: Montar pacote portátil
        run: python scripts/package.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: uds-${{ matrix.platform }}
          path: |
            dist-portable/*.zip
            dist-portable/*.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            zips/*.zip
            zips/*.sha256
          generate_release_notes: true
