[package]
name = "UniversalDevelopmentStudio"
version = "1.4.2"
edition = "2021"
description = "Ambiente universal e portátil para desenvolvimento, edição e visualização de arquivos."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
